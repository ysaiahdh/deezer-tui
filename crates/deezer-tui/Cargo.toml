[package]
name = "deezer-tui"
description = "Terminal UI for Deezer music player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "deezer-tui"
path = "src/main.rs"

[dependencies]
deezer-core = { path = "../deezer-core" }
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

arboard = "3"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MPRIS D-Bus media control (Linux desktops only). Lets hardware media keys
# and desktop now-playing widgets control the daemon.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"] }

# System Media Transport Controls (Windows 10+). Same role as MPRIS on Linux:
# media keys, the volume-flyout overlay and the "now playing" panel.
# `windows` is used directly to create the hidden window SMTC needs and to
# initialize the WinRT apartment (the daemon runs detached, without any window
# of its own).
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",           # WNDCLASSW (hbrBackground: HBRUSH)
    "Win32_System_Com",             # CoInitializeEx / CoUninitialize (WinRT)
    "Win32_System_LibraryLoader",   # GetModuleHandleW
    "Win32_UI_WindowsAndMessaging", # hidden window + message pump
] }
